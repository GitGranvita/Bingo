<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Cartelas - Bingo SIPAT</title>
<style>
  @page {
    size: A4 landscape;
    margin: 0;
  }
  @media print {
    body {
      margin: 0;
      padding: 0;
    }
    .pagina {
      page-break-after: always;
    }
  }
.cartela {
  width: 130mm;
  height: 90mm;
  border: 2px solid #333;
  padding: 5mm;
  background: #fff;
  box-sizing: border-box;
  page-break-inside: avoid;
  display: flex;
  flex-direction: column;
  
  position: relative; /* ESSENCIAL: diz para a imagem não fugir de dentro da cartela */
}

/* NOVA CLASSE PARA A IMAGEM */
.cartela .img-centro {
   position: absolute;
  top: 8%;
  left: 50%;
  transform: translate(-50%, -50%);
  max-width: 28%;
  max-height: 90%;
  z-index: 1;
  pointer-events: none;
}

.grade {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 4px;
  flex-grow: 1;
  user-select: none;
  margin-top: 19px;
  
  position: relative;
  z-index: 2; /* Camada de cima (Garante que os números fiquem por cima da imagem) */
}

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pagina {
    width: 280mm;  /* A4 paisagem útil */
    height: 190mm; /* Altura útil para 2 linhas */
    /*background: white;*/
    padding: 5mm 7mm;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8mm 10mm;
    margin-bottom: 10mm;
  }
  
  .titulo {
    font-weight: bold;
    font-size: 14pt;
    text-align: center;
    margin-bottom: 4px;
    user-select: none;
        color: #2ea983;
  }
   
  .item {
    border: 1px solid #ccc;
    text-align: center;
    padding: 1px 2px;
    font-size: 5.5pt;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .item img {
    width: 100%;
    max-height: 12mm;
    object-fit: contain;
    margin-bottom: 2px;
    user-select: none;
    flex-shrink: 0;
  }
  .num {
    font-weight: bold;
    font-size: 6pt;
    line-height: 1;
  }
  .nome {
    font-size: 5pt;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
    color: #3f5c5a;
  }
</style>
</head>
<body>
  <div id="container"></div>

  <script>
  const epis = [
  "Papel", "Plastico", "Organico", "Vidro", "Metal", "Varredura", 
  "Residuos Perigosos", "Rejeito", "ETE", "Aluminio", "Oleo usado", 
  "Solo", "Cinzas", "Agua", "Rios", "Chuva", "Arvores", "Semente", 
  "Oleo Lubrificante usado", "Raizes", "Folhas", "Sol", "Planeta Terra", 
  "MTR", "Container de plastico", "Tanque", "Coleta de Efluente", 
  "Madeira", "Residuos eletronicos", "Caçamba Roll-on", "Caçamba de rejeito", 
  "Consumo consciente", "Caçamba de Varredura", "Vento", "Plástico Strech", 
  "ANA", "Bombona de Rs", "Compostagem", "Container de papelão", 
  "Container de rejeito", "Caçamba de metal", "Fauna", "Poluição visual", 
  "Dia mundial de meio ambiente", "Coletor de Pilhas", "Reciclagem", 
  "Ibama", "RAPP", "Big Bag", "Lixeira de Infectante", "Descarpack", 
  "EPI_s contaminados", "53-IBC", "Kit de mitigação ambiental", 
  "SEMAD", "Outorga", "Poço artesiano", "FDS", "CAR", 
  "Armazenamento de oleo", "Coprocessamento", "Pallet de contenção", 
  "Lacre do bem", "Serragem", "Cone de Sinalização", "Aterro Sanitário", 
  "Armazenamento de resíduos", "Hidrometro", "Horimetro", 
  "Tanque de equalização", "Pallet"
];

    const totalCartelas = 52;
    const cartelasPorPagina = 4;
    const totalPaginas = Math.ceil(totalCartelas / cartelasPorPagina);

    function embaralhar(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function criarCartela(episCompletos) {
      const grade = document.createElement("div");
      grade.className = "grade";

      episCompletos.forEach(epi => {
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <img src="img/${epi.numero}.png" alt="EPI ${epi.numero}">
          <div class="num">N° ${epi.numero}</div>
          <div class="nome" title="${epi.nome}"><b>${epi.nome.toUpperCase()}</b></div>
        `;
        grade.appendChild(item);
      });

      const cartela = document.createElement("div");
      cartela.className = "cartela"; 
      cartela.innerHTML = '<img src="img/titulo_cartela.png" class="img-centro">';
      cartela.appendChild(grade);

      return cartela;
    }

    function gerarPaginas() {
      const container = document.getElementById("container");

      for(let pagina = 0; pagina < totalPaginas; pagina++) {
        const paginaDiv = document.createElement("div");
        paginaDiv.className = "pagina";

        for(let c = 0; c < cartelasPorPagina; c++) {
          const cartelaIndex = pagina * cartelasPorPagina + c;
          if(cartelaIndex >= totalCartelas) break;

          const indices = embaralhar([...Array(epis.length).keys()]).slice(0, 16);
          const cartelaEpis = indices.map(k => ({
            numero: k + 1,
            nome: epis[k]
          }));
          cartelaEpis.sort((a, b) => a.numero - b.numero);

          const cartela = criarCartela(cartelaEpis);
          paginaDiv.appendChild(cartela);
        }

        container.appendChild(paginaDiv);
      }
    }

    gerarPaginas();
  </script>
</body>
</html>
